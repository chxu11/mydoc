name: Docusaurus部署到 GitHub Pages

on:
  push:
    branches:
      - main
  # PR 阶段提前拦截：死链 / frontmatter 契约失败在合并前就报错（不部署）
  pull_request:
    branches:
      - main
    # 如果你想进一步定义触发器、路径等，可以查看 GitHub Actions 文档
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on
  workflow_dispatch:  # 添加这一行即可手动触发  

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 1️⃣构建 Docusaurus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci
      - name: 构建网站
        run: npm run build
      # 图片门禁：docs 里不许留 Wikimedia 直链（第三方改名/限流 = 读者看到裂图），
      # 本地图必须真实存在且登记在 static/img/docs/manifest.json（出处可追溯）
      - name: 图片本地化校验
        run: npm run check:images
      # 三层回归：公式解析性质 / 生成器注册表与正文挂载 / 产物里的实际几何
      # 依赖上一步的 build/ 产物，必须排在构建之后
      - name: 实验室回归校验
        run: npm run check:lab

      - name: 上传构建产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: 2️⃣部署到 GitHub Pages
    needs: build
    # PR 只跑构建门禁，不部署
    if: github.event_name == 'push'

    # 授予 GITHUB_TOKEN 部署到 Pages 所需的权限
    permissions:
      pages: write # 用于部署到 Pages
      id-token: write # 用于验证部署来源的合法性


    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # 部署后的 URL...
    runs-on: ubuntu-latest
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
